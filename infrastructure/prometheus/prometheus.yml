global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "argus"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "argus_.*"
        action: keep

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]